[package]
name = "iceberg_inspect"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iceberg-inspect"
path = "src/main.rs"

[dependencies]
# Arrow + Parquet (always use the same version for both)
arrow = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow"] }

# Object store (local filesystem + S3)
object_store = { version = "0.13", features = ["aws"] }

# Avro (for manifest lists and manifest files)
apache-avro = "0.17"

# Serde (for metadata.json parsing)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Terminal table display
comfy-table = "7"

# Url
url = "2.5.4"